name: README freshness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  readme-freshness:
    name: Require README update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation accompanies implementation changes
        run: python3 tools/check_readme_update.py --event "$GITHUB_EVENT_PATH"
